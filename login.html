<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SecureNet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Secure<span>Net</span></a>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </nav>

    <main class="auth-section">
        <div class="auth-card">
            <div class="auth-icon">🛡️</div>

            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your SecureNet account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn">Login to SecureNet</button>

                <p id="formMessage" class="form-message"></p>
            </form>

            <!-- Google OAuth Section -->
            <div style="display: flex; align-items: center; margin: 20px 0; color: #888;">
                <hr style="flex: 1; border: none; border-top: 1px solid #333;">
                <span style="padding: 0 10px; font-size: 0.85rem; text-transform: uppercase;">or</span>
                <hr style="flex: 1; border: none; border-top: 1px solid #333;">
            </div>

            <div id="googleButtonContainer" style="display: flex; justify-content: center; min-height: 44px;"></div>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>
    </main>

    <!-- Load local auth handler FIRST so the callback exists globally -->
    <script src="js/auth.js"></script>

    <!-- Load Google Identity Services library -->
    <script src="https://accounts.google.com/gsi/client" onload="renderGoogleButton()" async defer></script>
</body>
</html>
