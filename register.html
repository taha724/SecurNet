<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SecureNet</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Secure<span>Net</span></a>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </nav>

    <main class="auth-section">
        <div class="auth-card">
            <div class="auth-icon">🔐</div>

            <h1>Create Account</h1>
            <p class="auth-subtitle">Join SecureNet and improve your digital safety</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create a password" required minlength="8">
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>
                    <small class="input-hint">Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <label class="terms-label">
                    <input type="checkbox" id="terms" required>
                    I agree to the Terms and Privacy Policy.
                </label>

                <button type="submit" class="auth-btn">Create Secure Account</button>

                <p id="formMessage" class="form-message"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
